<script>
const enc=new TextEncoder(),dec=new TextDecoder(),$=i=>document.getElementById(i),val=i=>$(i).value;
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const H=async s=>hex(await crypto.subtle.digest('SHA-256',enc.encode(s)));
const rnd=n=>hex(crypto.getRandomValues(new Uint8Array(n)));
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));

async function hashPw(p,s){const k=await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(s),iterations:150000,hash:'SHA-256'},k,256))}
const STATES={S1:'Aurelia',S2:'Meridia'};
const CONS=[{id:'C1',n:'Riverbend',s:'S1'},{id:'C2',n:'Hillcrest',s:'S1'},{id:'C3',n:'Lakeshore',s:'S2'},{id:'C4',n:'Stonegate',s:'S2'}];
const PARTIES={UF:'Unity Front',CA:'Civic Alliance',GC:'Green Commons',IND:'Independent'};
const SYM={UF:'Lantern',CA:'Compass',GC:'Sapling',IND:'Anchor'};
const NM=['Aarav Menon','Diya Kulkarni','Rohan Iyer','Meera Banerjee','Kabir Nair','Ishita Rao','Vikram Sethi','Anaya Das','Tara Pillai','Neel Joshi','Sana Qureshi','Arjun Bhat'];
const PL=[['UF','CA','IND'],['CA','GC','UF'],['GC','UF','CA'],['UF','IND','GC']];
const CANDS=CONS.flatMap((c,i)=>PL[i].map((p,j)=>({id:c.id+'-'+p,n:NM[i*3+j],p,c:c.id,sym:SYM[p],bio:'Fictional simulation candidate for '+c.n+'. No real person.',man:'Fictional manifesto: local services, transparent governance and open budgets.'})));
const FN=['Asha','Bharat','Chitra','Dev','Esha','Farhan','Gita','Harsh'],LN=['Verma','Naidu','Shah','Reddy'];
const ROLL=Array.from({length:24},(_,k)=>{const i=k+1;return{epic:'ZZX'+String(i).padStart(7,'0'),name:FN[i%8]+' '+LN[Math.floor(i/6)%4],dob:`${1980+i}-0${1+i%9}-1${i%9}`,c:CONS[i%4].id,flag:i===13?'extra':i===14?'pending':null}});

const S={citizens:{},sess:null,otp:null,tries:[],election:{status:'draft',tally:null,published:false},ballots:[],chain:[],auth:{},admin:null,salt:rnd(8),log:[],receipt:null,curAuth:null,fc:'C1'};

const PERM={super:['open','close','tally','publish','demo','verify'],election:['open','close','tally','demo','verify'],auditor:['verify']};

const cname=id=>CONS.find(c=>c.id===id).n;
const GEN='0'.repeat(64);
const bh=b=>H([b.i,b.prev,b.type,b.commitment,b.nullifier,b.ts].join('|'));
async function addBlock(type,commitment='',nullifier=''){const p=S.chain.at(-1);const b={i:S.chain.length,prev:p?p.hash:GEN,type,commitment,nullifier,ts:Date.now()};b.hash=await bh(b);S.chain.push(b);return b}
async function verifyChain(){for(let k=0;k<S.chain.length;k++){const b=S.chain[k];if(b.prev!==(k?S.chain[k-1].hash:GEN)||b.hash!==await bh(b))return k}return -1}
async function cast(r,candId,authId){
if(S.election.status!=='open')throw Error('Election is not open');
const a=S.auth[authId];if(!a||a.used||a.e!==r.epic)throw Error('Authorization invalid or already consumed (replay blocked)');

async function doVerify(){
if(!$('vc').checked)return toast('Consent is required',1);
const e=val('ve').trim().toUpperCase(),n=val('vn').trim(),d=val('vd'),p=val('vp');
if(!/^[A-Z]{3}\d{7}$/.test(e))return toast('EPIC must be 3 letters and 7 digits',1);
if($('vf').files[0])$('vf').value='';
const r=await adapter.lookup(e);let st;
if(!r)st='Electoral Roll Entry Not Found';else if(r.name.toLowerCase()!==n.toLowerCase()||r.dob!==d)st='Verification Failed';else if(r.flag==='extra')st='Additional Verification Required';else if(r.flag==='pending')st='Pending Verification';else st='Verified';
$('vres').innerHTML=`<p>Status: ${chip(st,st==='Verified')}</p>`;note('Verification '+mask(e)+': '+st);
if(st!=='Verified')return;
if(S.citizens[e])return toast('Duplicate registration blocked',1);
if(p.length<8)return toast('Choose a password of at least 8 characters',1);
S.citizens[e]={epic:e,c:r.c,voted:false,pw:await hashPw(p,e)};toast('Verified and registered. You can now log in.')}
async function doLogin(){const e=val('le').trim().toUpperCase(),p=val('lp'),now=Date.now();
S.tries=S.tries.filter(t=>now-t<60000);if(S.tries.length>=5)return toast('Rate limit reached. Wait one minute.',1);S.tries.push(now);
const c=S.citizens[e];if(!c||!c.pw||c.pw!==await hashPw(p,e))return toast('Invalid credentials',1);
const code=String(100000+crypto.getRandomValues(new Uint32Array(1))[0]%900000);S.otp={e,code,exp:now+120000};
$('otpbox').innerHTML=`<label for="oc">One-time code</label><input id="oc" inputmode="numeric"><button class="p" onclick="doOtp()">Confirm</button>`;toast('Demo SMS: your OTP is '+code)}
function doOtp(){const o=S.otp;if(!o||Date.now()>o.exp||val('oc')!==o.code)return toast('OTP invalid or expired',1);S.sess={e:o.e,exp:Date.now()+600000};S.otp=null;S.curAuth=null;go('vote');toast('Signed in. Session valid for 10 minutes.')}
function doAuth(){const s=sess();if(!s)return render();const id=rnd(8);S.auth[id]={e:s.e,used:false,exp:Date.now()+300000};S.curAuth=id;note('Authorization issued to '+mask(s.e));render()}
async function doCast(){const s=sess();if(!s)return render();const pick=document.querySelector('input[name=cand]:checked');if(!pick)return toast('Select a candidate',1);
try{S.receipt=await cast(ROLL.find(x=>x.epic===s.e),pick.value,S.curAuth);S.lastAuth=S.curAuth;S.curAuth=null;toast('Ballot encrypted and committed to block #'+S.receipt.block);render()}catch(x){toast(x.message,1)}}
async function doReplay(){const s=sess();if(!s)return render();try{await cast(ROLL.find(y=>y.epic===s.e),CANDS.find(y=>y.c===ROLL.find(z=>z.epic===s.e).c).id,S.lastAuth)}catch(x){toast('Replay rejected: '+x.message,1)}}
async function doVerifyChain(){const k=await verifyChain();$('cres').innerHTML=k<0?`<p>${chip('Chain valid',true)}</p>`:`<p>${chip('Integrity failure at block '+k,false)}</p>`;note('Chain verification: '+(k<0?'valid':'failed at '+k))}
function tamper(t){if(!can('verify'))return toast('Sign in as an administrator or auditor first',1);
if(t==='chain'){const b=S.chain.find(x=>x.type==='BallotCommitted')||S.chain[0];if(!b)return toast('No blocks yet',1);b.commitment='f'.repeat(64)}
else{const b=S.ballots[0];if(!b)return toast('No ballots yet',1);const u=unb64(b.ct);u[0]^=1;b.ct=b64(u)}
toast('Tamper test applied. Run verification or tally to see it caught.',1)}
async function doAdmin(){const r=val('ar');if(!ADM[r])return toast('Still preparing, retry',1);if(ADM[r]!==await hashPw(val('ap'),'adm'+r))return toast('Invalid administrator credentials',1);S.admin=r;note('Admin sign-in: '+r);go('admin')}
async function doOpen(){if(!can('open')||E().status!=='draft')return toast('Not permitted or already opened',1);KEY=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);E().status='open';await addBlock('ElectionOpened');toast('Election opened');render()}
async function doDemo(){if(!can('demo')||E().status!=='open')return toast('Open the election first',1);let n=0;
for(const r of ROLL){if(r.flag||S.citizens[r.epic])continue;S.citizens[r.epic]={epic:r.epic,c:r.c,voted:false,pw:''};const id=rnd(8);S.auth[id]={e:r.epic,used:false,exp:Date.now()+3e5};const o=CANDS.filter(x=>x.c===r.c);try{await cast(r,o[Math.floor(Math.random()*o.length)].id,id);n++}catch(x){}}
toast(n+' demo ballots committed through the standard pipeline');render()}
async function doClose(){if(!can('close')||E().status!=='open')return toast('Not permitted or not open',1);E().status='closed';await addBlock('ElectionClosed');toast('Election closed');render()}
async function doTally(){if(!can('tally'))return toast('Not authorized',1);if(E().status!=='closed')return toast('Close the election before tallying',1);
const k=await verifyChain();if(k>=0)return toast('Chain integrity failure at block '+k+'. Tally rejected.',1);
const res={};CONS.forEach(c=>{res[c.id]={}});CANDS.forEach(x=>{res[x.c][x.id]=0});let bad=0;
for(const b of S.ballots){try{const d=JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(b.iv)},KEY,unb64(b.ct))));if(await H(d.candId+'|'+d.salt)!==S.chain[b.blk].commitment)throw 0;res[d.c][d.candId]++}catch(x){bad++}}
const rows=CONS.map(c=>{const v=res[c.id],m=Math.max(...Object.values(v)),w=Object.keys(v).filter(k=>v[k]===m);return{c:c.id,votes:v,win:w.length===1&&m>0?w[0]:null,tie:w.length>1||m===0}});
const seats={};rows.forEach(r=>{if(r.win){const p=CANDS.find(x=>x.id===r.win).p;seats[p]=(seats[p]||0)+1}});
E().tally={rows,seats,rejected:bad,done:rows.length,hash:await H(JSON.stringify(rows))};toast(bad?bad+' ballot(s) rejected for commitment verification failure':'Tally complete: all commitments verified',!!bad);render()}
async function doPublish(){if(!can('publish'))return toast('Only a Super Administrator can publish',1);if(!E().tally)return toast('Run the tally first',1);E().published=true;await addBlock('ResultPublished',E().tally.hash);toast('Simulated results published');render()}
